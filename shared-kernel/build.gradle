plugins {
    id 'java-common-conventions'
    id 'java-library'
    //id 'io.spring.dependency-management' 
    id "spring-boot-conventions"
}

group = 'com.icms'
version = '0.0.1-SNAPSHOT'

dependencies {

    //audit Envers
    implementation libs.spring.data.envers

    // Spring Data JPA (for MappedSuperclass, JPA Annotations and Auditing)
    compileOnly libs.spring.boot.starter.data.jpa
    
    // Spring Web (for DTOs, RestControllerAnnotations and LocaleContextHolder)
    compileOnly libs.spring.boot.starter.web
    
    // Spring Security (for extracting the authenticated user in AuditorAware)
    compileOnly libs.spring.boot.starter.security
    // Jackson for JSON serialization and deserialization
    // implementation 'com.fasterxml.jackson.core:jackson-databind'
    // implementation libs.jackson.datatype.jsr310

    // Unit tests for the generic i18n bundle contract (JUnit 5, AssertJ, Mockito)
    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform
}