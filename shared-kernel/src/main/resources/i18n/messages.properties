# Common & Unexpected
E-000=An unexpected error occurred. Please try again later.

# Success 
S-000=Entity created successfully
S-001=Entity updated successfully
S-002=Entity deleted successfully

# Entity Errors
Ent-001=Entity not found.
Ent-002=Entity already exists.
Ent-003=Entity must have an id.
Ent-004=Entity must be new.
Ent-005=Entity cannot be deleted.
Ent-006=Entity cannot be updated.
Ent-007=Entity cannot be created.

# Catalog Errors
Cat-001=The catalog code must exist.
Cat-002=The catalog code must be unique.

# Language Errors
Lan-001=The specified language is not supported.
Lan-002=Language file missing.
Lan-003=There was an error parsing the language file.
Lan-004=The translation for the specified language is missing.
Lan-005=There was an error in the language configuration.
Lan-006=There must be at least one translation for each catalog.
Lan-007=A translation for this catalog and language already exists.

# User Errors
Usr-001=User not found.
Usr-002=User already exists.
Usr-003=User must have an id.
Usr-004=User must be new.
Usr-005=User cannot be deleted.
Usr-006=User cannot be updated.
Usr-007=User cannot be created.
Usr-008=User with invalid email.
Usr-009=Does not exist user with the specified email.

# User Profile Errors
UsrProf-001=UserProfile not found.
UsrProf-009=UserProfile must be associated with a valid User.
UsrProf-010=UserProfile must be associated with the same User.
