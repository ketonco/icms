# Common Errors
E-001=An unexpected error occurred. Please try again later.
E-002=The submitted data is not valid.

# Resource Errors
Res-001=Resource not found.

# Success Messages
S-001=Entity created successfully
S-002=Entity updated successfully
S-003=Entity deleted successfully

# Entity Errors
Ent-001=Entity not found.
Ent-002=Entity must have an id.
Ent-003=Entity must be new.
Ent-004=Entity cannot be deleted.
Ent-005=Entity cannot be updated.

# Catalog Errors
Cat-001=The catalog code must exist.
Cat-002=The catalog code must be unique.

# Language Errors
Lan-001=A language with the specified name already exists.
Lan-002=A translation for this catalog and language already exists.
Lan-003=There must be at least one translation for each catalog.

# User Errors
Usr-001=Does not exist user with the specified email.
Usr-002=There is already an existing user with the specified email.
Usr-003=There is already an existing user with the specified username.

# User Profile Errors
UsrProf-001=UserProfile not found.
UsrProf-002=UserProfile must be associated with a valid User.
UsrProf-003=UserProfile must be associated with the same User.

# Language Validation
lang.code.blank=Code cannot be blank
lang.code.size=Code must be between 2 and 10 characters
lang.code.pattern=Code must follow BCP 47 format (e.g. 'es', 'es-ES')
lang.name.blank=Name cannot be blank
lang.name.size=Name must be between 1 and 100 characters
lang.isdefault.null=isDefault cannot be null
lang.active.null=Active cannot be null

# Permission Validation
perm.code.blank=Code must not be blank
perm.code.pattern=Code must be at least 2 uppercase letters
perm.name.blank=Name must not be blank
perm.active.null=Active cannot be null

# User Type Validation
usrtype.code.blank=Code must not be blank
usrtype.code.pattern=Code must be 3 uppercase letters
usrtype.name.blank=Name must not be blank
usrtype.active.null=Active cannot be null

# User Type Translation Validation
usrtypetrans.catalogid.null=Catalog ID cannot be blank
usrtypetrans.languageid.null=Language ID cannot be blank
usrtypetrans.translation.blank=Translation cannot be blank

# User Status Validation
usrstatus.code.blank=Code must not be blank
usrstatus.code.pattern=Code must be 3 uppercase letters
usrstatus.name.blank=Name must not be blank
usrstatus.active.null=Active cannot be null

# User Status Translation Validation
usrstatustrans.catalogid.null=Catalog ID cannot be blank
usrstatustrans.languageid.null=Language ID cannot be blank
usrstatustrans.translation.blank=Translation cannot be blank

# Create User Validation
usr.username.blank=Username cannot be blank
usr.username.size=Username must be between 3 and 50 characters
usr.password.blank=Password cannot be blank
usr.password.size=Password must be between 6 and 100 characters
usr.password.pattern=Password must include at least one number, one special character, one letter and one uppercase letter
usr.email.blank=Email cannot be blank
usr.email.format=Invalid email format
usr.email.size=Email must be at most 100 characters
usr.profile.null=User profile cannot be null

# User Profile Validation
usrprof.firstname.blank=First name must not be blank
usrprof.firstname.size=First name must be between 2 and 50 characters
usrprof.lastname.blank=Last name must not be blank
usrprof.lastname.size=Last name must be between 2 and 50 characters
usrprof.email.blank=Email must not be blank
usrprof.email.size=Email must be at most 100 characters
