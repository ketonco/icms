# Common Errors
E-001=Un error inesperado ocurrió. Por favor, inténtelo de nuevo más tarde.
E-002=Los datos enviados no son válidos.

# Resource Errors
Res-001=Recurso no encontrado.

# Success Messages
S-001=Entidad creada con éxito
S-002=Entidad actualizada con éxito
S-003=Entidad eliminada con éxito

# Entity Errors
Ent-001=Entidad no encontrada.
Ent-002=La entidad debe tener un id.
Ent-003=La entidad debe ser nueva.
Ent-004=La entidad no puede ser eliminada.
Ent-005=La entidad no puede ser actualizada.

# Catalog Errors
Cat-001=El código del catálogo debe existir.
Cat-002=El código del catálogo debe ser único.

# Language Errors
Lan-001=Ya existe un idioma con el nombre especificado.
Lan-002=Ya existe una traducción para este catálogo y idioma.
Lan-003=Debe haber al menos una traducción para cada catálogo.

# User Errors
Usr-001=No existe un usuario con el correo electrónico especificado.
Usr-002=Ya existe un usuario con el correo electrónico especificado.
Usr-003=Ya existe un usuario con el nombre de usuario especificado.

# User Profile Errors
UsrProf-001=Perfil de usuario no encontrado.
UsrProf-002=El perfil de usuario debe estar asociado con un Usuario válido.
UsrProf-003=El perfil de usuario debe estar asociado con el mismo Usuario.

# Language Validation
lang.code.blank=El código no debe estar vacío
lang.code.size=El código debe tener entre 2 y 10 caracteres
lang.code.pattern=El código debe seguir el formato BCP 47 (ej. 'es', 'es-ES')
lang.name.blank=El nombre no debe estar vacío
lang.name.size=El nombre debe tener entre 1 y 100 caracteres
lang.isdefault.null=isDefault no puede ser nulo
lang.active.null=Activo no puede ser nulo

