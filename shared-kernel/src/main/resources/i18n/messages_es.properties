# Common & Unexpected
000=Un error inesperado ocurrió. Por favor, inténtelo de nuevo más tarde.

# Entity Errors
Ent-001=Entidad no encontrada.
Ent-002=La entidad ya existe.
Ent-003=La entidad debe tener un id.
Ent-004=La entidad debe ser nueva.
Ent-005=La entidad no puede ser eliminada.
Ent-006=La entidad no puede ser actualizada.
Ent-007=La entidad no puede ser creada.

# Catalog Errors
Cat-001=El código del catálogo debe existir.
Cat-002=El código del catálogo debe ser único.

# Language Errors
Lan-001=El idioma especificado no es compatible.
Lan-002=Falta el archivo de idioma.
Lan-003=Hubo un error al analizar el archivo de idioma.
Lan-004=Falta la traducción para el idioma especificado.
Lan-005=Hubo un error en la configuración del idioma.