# Common & Unexpected
E-000=Un error inesperado ocurrió. Por favor, inténtelo de nuevo más tarde.

# Success 
S-000=Entidad creada con éxito
S-001=Entidad actualizada con éxito
S-002=Entidad eliminada con éxito

# Entity Errors
Ent-001=Entidad no encontrada.
Ent-002=La entidad ya existe.
Ent-003=La entidad debe tener un id.
Ent-004=La entidad debe ser nueva.
Ent-005=La entidad no puede ser eliminada.
Ent-006=La entidad no puede ser actualizada.
Ent-007=La entidad no puede ser creada.

# Catalog Errors
Cat-001=El código del catálogo debe existir.
Cat-002=El código del catálogo debe ser único.

# Language Errors
Lan-001=El idioma especificado no es compatible.
Lan-002=Falta el archivo de idioma.
Lan-003=Hubo un error al analizar el archivo de idioma.
Lan-004=Falta la traducción para el idioma especificado.
Lan-005=Hubo un error en la configuración del idioma.
Lan-006=Debe haber al menos una traducción para cada catálogo.
Lan-007=Ya existe una traducción para este catálogo y idioma.

# User Errors
Usr-001=Usuario no encontrado.
Usr-002=El usuario ya existe.
Usr-003=El usuario debe tener un id.
Usr-004=El usuario debe ser nuevo.
Usr-005=El usuario no puede ser eliminado.
Usr-006=El usuario no puede ser actualizado.
Usr-007=El usuario no puede ser creado.
Usr-008=Usuario con correo electrónico inválido.
Usr-009=No existe un usuario con el correo electrónico especificado.

# User Profile Errors
UsrProf-001=Perfil de usuario no encontrado.
UsrProf-009=El perfil de usuario debe estar asociado con un Usuario válido.
UsrProf-010=El perfil de usuario debe estar asociado con el mismo Usuario.