server:
  port: ${PORT_GATEWAY:8080}

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          # Definición de Rutas hacia los Microservicios
          routes:
            - id: servicio-autenticacion-usuarios
              uri: http://${HOST_USER_AUTH:localhost}:${PORT_USER_AUTH:8081}
              predicates:
                - Path=/api/v1/auth/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

  liquibase:
    enabled: false

    
  session:
    store-type: none
    
  cache:
    type: none