plugins {
	id 'spring-boot-conventions'
	id 'org.liquibase.gradle'
}

group = 'com.icms'
version = '0.0.1-SNAPSHOT'

configurations {
    mockitoAgent
}

dependencies {
	// Módulo local del mismo proyecto Gradle; no es necesario declararlo como dependencia publicada.
	implementation project(':shared-kernel')
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.data:spring-data-envers'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	compileOnly 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'info.picocli:picocli:4.7.6'

	annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
	testImplementation 'org.mockito:mockito-core:5.14.2'
	testImplementation 'org.instancio:instancio-junit:5.4.0'

	testCompileOnly 'org.projectlombok:lombok'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testAnnotationProcessor 'org.projectlombok:lombok'

	// Requerido por la tarea de Liquibase para ejecutar desde CLI
    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.6'
    liquibaseRuntime sourceSets.main.output

	mockitoAgent('org.mockito:mockito-core:5.14.2') { transitive = false }
}

// Configuración de la base de datos EXCLUSIVA de este microservicio
liquibase {
    activities {
        main {
            changelogFile 'user-auth/src/main/resources/db/migration-root.yaml'
            
            // Toma la propiedad por CLI (-PdbUrl=...) o usa la BD por defecto de este servicio
            url project.hasProperty('dbUrl') ? project.property('dbUrl') : 'jdbc:postgresql://localhost:25432/ICMS_UA'
            username project.hasProperty('dbUser') ? project.property('dbUser') : 'postgres'
            password project.hasProperty('dbPassword') ? project.property('dbPassword') : 'adm123456'
        }
    }
}
/** Configuración de pruebas con JUnit y Mockito */
tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}
