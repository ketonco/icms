plugins {
    id 'spring-jpa-conventions'
    id 'migration-conventions'
    id 'spring-web-conventions'
}

group = 'com.icms'
version = '0.0.1-SNAPSHOT'

configurations {
    mockitoAgent
}

dependencies {
	// Módulo local del mismo proyecto Gradle; no es necesario declararlo como dependencia publicada.
	implementation project(':shared-kernel')
	implementation libs.spring.boot.starter.security

	testImplementation libs.spring.boot.starter.security.test
	testImplementation libs.spring.boot.starter.webmvc.test
	testImplementation libs.spring.boot.test.autoconfigure
	testImplementation libs.mockito.core
	testImplementation libs.instancio.junit
    testImplementation libs.spring.boot.starter.webflux
    testImplementation libs.rest.assured
    testImplementation libs.rest.assured.mockmvc

	testRuntimeOnly libs.junit.platform

	// Requerido por la tarea de Liquibase para ejecutar desde CLI postgre
    liquibaseRuntime libs.postgresql

	mockitoAgent(libs.mockito.core) { transitive = false }
}

// Configuración de la base de datos EXCLUSIVA de este microservicio
liquibase {
    activities {
        main {
            changelogFile 'user-auth/src/main/resources/db/migration-root.yaml'

            // No hardcoded credentials (P-13). Order: -PdbPassword, then User env DB_PASSWORD.
            def resolvedDbUrl = project.hasProperty('dbUrl') ? project.property('dbUrl').toString() : 'jdbc:postgresql://localhost:25432/ICMS_UA'
            def envDbPassword = System.getenv('DB_PASSWORD')
            def resolvedDbPassword
            if (project.hasProperty('dbPassword')) {
                resolvedDbPassword = project.property('dbPassword')
            } else if (envDbPassword != null && !envDbPassword.isEmpty()) {
                resolvedDbPassword = envDbPassword
            } else {
                throw new GradleException("Missing database password: use -PdbPassword=xxx or set User env DB_PASSWORD (current URL: ${resolvedDbUrl})")
            }
            url resolvedDbUrl
            username project.hasProperty('dbUser') ? project.property('dbUser') : 'postgres'
            password resolvedDbPassword
        }
    }
}
