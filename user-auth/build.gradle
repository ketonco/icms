plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.liquibase.gradle' version '2.2.2'
}

group = 'com.icms'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.data:spring-data-envers'

	compileOnly 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'info.picocli:picocli:4.7.6'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	testCompileOnly 'org.projectlombok:lombok'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testAnnotationProcessor 'org.projectlombok:lombok'

	// Requerido por la tarea de Liquibase para ejecutar desde CLI
    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.6'
    liquibaseRuntime sourceSets.main.output
}

// Configuración de la base de datos EXCLUSIVA de este microservicio
liquibase {
    activities {
        main {
            changelogFile 'user-auth/src/main/resources/db/migration-root.yaml'
            
            // Toma la propiedad por CLI (-PdbUrl=...) o usa la BD por defecto de este servicio
            url project.hasProperty('dbUrl') ? project.property('dbUrl') : 'jdbc:postgresql://localhost:25432/ICMS_UA'
            username project.hasProperty('dbUser') ? project.property('dbUser') : 'postgres'
            password project.hasProperty('dbPassword') ? project.property('dbPassword') : 'adm123456'
        }
    }
}

tasks.named('test') {
	useJUnitPlatform()
}
