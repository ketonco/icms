databaseChangeLog:
  - changeSet:
      id: 20260916_0004_create_user_types_001
      author: Maximo
      changes:
        - createTable:
            tableName: user_types
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_types
            columnNames: user_id, type_id
            constraintName: pk_user_types

        - addForeignKeyConstraint:
            baseTableName: user_types
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_types_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: user_types
            baseColumnNames: type_id
            referencedTableName: usertypes
            referencedColumnNames: id
            constraintName: fk_user_types_type
            onDelete: RESTRICT

      rollback:
        - dropTable:
            tableName: user_types
            cascadeConstraints: true

  - changeSet:
      id: 20260916_0004_create_user_types_index_002
      author: Maximo
      changes:
        - createIndex:
            indexName: idx_user_types_type_id
            tableName: user_types
            columns:
              - column:
                  name: type_id
      rollback:
        - dropIndex:
            indexName: idx_user_types_type_id
            tableName: user_types

  - changeSet:
      id: 20260916_0004_create_user_types_revision_003
      author: Maximo
      changes:
        - createTable:
            tableName: user_types_aud
            columns:
              - column:
                  name: rev
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: TINYINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_types_aud
            columnNames: rev, user_id, type_id
            constraintName: pk_user_types_aud

        - addForeignKeyConstraint:
            baseTableName: user_types_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_user_types_aud_rev
            onDelete: CASCADE