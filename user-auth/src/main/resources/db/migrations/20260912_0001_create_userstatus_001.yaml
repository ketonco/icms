databaseChangeLog:
  - changeSet:
      id: 20260912_0001_create_userstatus_001
      comment: "Create user status table"
      author: "Maximo"
      changes:
        - createSequence:
            sequenceName: userstatus_seq
            startValue: 1
            incrementBy: 50
        
        - createTable:
            tableName: userstatus
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  constraints:
                    nullable: false
                    updatable: false
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: "created_by"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  constraints:
                    nullable: false
                    updatable: true
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: "updated_by"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            cascadeConstraints: false
            tableName: userstatus
        - dropSequence:
            sequenceName: userstatus_seq

  - changeSet:
      id: 20260912_0001_create_userstatus_indexes_002
      author: "Maximo"
      preConditions:
        - tableExists:
            tableName: userstatus
      changes:
        - createIndex:
            indexName: idx_userstatus_id
            tableName: userstatus
            columns:
              - column:
                  name: id

        - createIndex:
            indexName: idx_userstatus_code
            tableName: userstatus
            columns:
              - column:
                  name: code

      rollback:
        - dropIndex:
            indexName: idx_userstatus_id
            tableName: userstatus

        - dropIndex:
            indexName: idx_userstatus_code
            tableName: userstatus

  - changeSet:
      id: 20260912_0001_create_userstatus_revision_003
      author: "Maximo"
      changes:
        - createTable:
            tableName: userstatus_aud
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: TINYINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: userstatus_aud
            columnNames: id, rev
            constraintName: pk_userstatus_aud

        - addForeignKeyConstraint:
            baseTableName: userstatus_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_userstatus_aud_revinfo
            onDelete: CASCADE

      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: userstatus_aud

  - changeSet:
      id: 20260912_0001_create_userstatus_revision_indexes_004
      author: "Maximo"
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: userstatus_aud
      changes:
        - createIndex:
            tableName: userstatus_aud
            indexName: idx_userstatus_aud_rev
            columns:
              - column:
                  name: rev
        - createIndex:
            tableName: userstatus_aud
            indexName: idx_userstatus_aud_id
            columns:
              - column:
                  name: id

      rollback:
        - dropIndex:
            tableName: userstatus_aud
            indexName: idx_userstatus_aud_rev
        - dropIndex:
            tableName: userstatus_aud
            indexName: idx_userstatus_aud_id