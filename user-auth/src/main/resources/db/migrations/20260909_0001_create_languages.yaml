databaseChangeLog:
  - changeSet:
      id: 20260909_0001_create_languages_001
      comments: "Creación de la tabla de idiomas"
      author: "Maximo"
      changes:
        - createSequence:
            sequenceName: languages_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: languages
            remarks: "Tabla de idiomas"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: languages_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_languages
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    updatable: true
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    updatable: true
                    defaultValue: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    updatable: true
              - column:
                  name: is_default
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    updatable: true
                    defaultValue: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  constraints:
                    nullable: false
                    updatable: false
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: "created_by"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  constraints:
                    nullable: false
                    updatable: true
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: "updated_by"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            cascadeConstraints: false
            tableName: languages
        - dropSequence:
            sequenceName: languages_seq

  - changeSet:
      id: 20260909_0001_create_languages_indexes_002
      author: "Maximo"
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: languages
      changes:
        - createIndex:
            tableName: languages
            indexName: idx_id_languages
            columns:
              - column:
                  name: id

        - createIndex:
            tableName: languages
            indexName: idx_code_languages
            columns:
              - column:
                  name: code

      rollback:
        - dropIndex:
            tableName: languages
            indexName: idx_id_languages

        - dropIndex:
            tableName: languages
            indexName: idx_code_languages