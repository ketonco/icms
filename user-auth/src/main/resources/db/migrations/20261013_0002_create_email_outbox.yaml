databaseChangeLog:
  - changeSet:
      id: 20261013_0002_create_email_outbox_001
      comment: "Create email_outbox table"
      author: "Maximo"
      changes:
        - createTable:
            tableName: email_outbox
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_email_outbox
                    nullable: false
              - column:
                  name: recipient
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: template
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: VARCHAR(500)
              - column:
                  name: sent_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    updatable: false
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: email_outbox

  - changeSet:
      id: 20261013_0002_create_email_outbox_indexes_002
      author: "Maximo"
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: email_outbox
      changes:
        - createIndex:
            tableName: email_outbox
            indexName: idx_email_outbox_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: email_outbox
            indexName: idx_email_outbox_recipient
            columns:
              - column:
                  name: recipient
      rollback:
        - dropIndex:
            tableName: email_outbox
            indexName: idx_email_outbox_status
        - dropIndex:
            tableName: email_outbox
            indexName: idx_email_outbox_recipient

  - changeSet:
      id: 20261013_0002_create_email_outbox_revision_003
      author: "Maximo"
      changes:
        - createTable:
            tableName: email_outbox_aud
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: recipient
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: template
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: VARCHAR(500)
              - column:
                  name: sent_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: TINYINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: email_outbox_aud
            columnNames: id, rev
            constraintName: pk_email_outbox_aud
        - addForeignKeyConstraint:
            baseTableName: email_outbox_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_email_outbox_aud_revinfo
            onDelete: CASCADE
      rollback:
        - dropTable:
            cascadeConstraints: true
            tableName: email_outbox_aud

  - changeSet:
      id: 20261013_0002_create_email_outbox_revision_indexes_004
      author: "Maximo"
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: email_outbox_aud
      changes:
        - createIndex:
            tableName: email_outbox_aud
            indexName: idx_email_outbox_aud_rev
            columns:
              - column:
                  name: rev
        - createIndex:
            tableName: email_outbox_aud
            indexName: idx_email_outbox_aud_id
            columns:
              - column:
                  name: id
      rollback:
        - dropIndex:
            tableName: email_outbox_aud
            indexName: idx_email_outbox_aud_rev
        - dropIndex:
            tableName: email_outbox_aud
            indexName: idx_email_outbox_aud_id
