databaseChangeLog:
  - changeSet:
      id: 20260907_0001_create_revinfo_001
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: revinfo
      changes:
        - createSequence:
            sequenceName: revinfo_seq
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: revinfo
            remarks: "Tabla de revisiones de Hibernate Envers para auditoria"
            columns:
              - column:
                  name: rev
                  type: INTEGER
                  defaultValueSequenceNext: revinfo_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_revinfo
                    nullable: false
              - column:
                  name: revtstmp
                  type: BIGINT
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            cascadeConstraints: false
            tableName: revinfo
        - dropSequence:
            sequenceName: revinfo_seq

  - changeSet:
      id: 20260907_0001_create_revinfo_indexes_002
      author: system
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: revinfo
      changes:
        - createIndex:
            tableName: revinfo
            indexName: idx_revinfo_revtstmp
            columns:
              - column:
                  name: revtstmp

      rollback:
        - dropIndex:
            tableName: revinfo
            indexName: idx_revinfo_revtstmp