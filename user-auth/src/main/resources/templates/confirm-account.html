<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="#{mail.confirm.title}">Confirm your account</title>
	<style>
		body {
			max-width: 600px;
			margin: 32px auto;
			padding: 32px;
			background-color: #f3f4f6;
			color: #374151;
			font-family: Arial, Helvetica, sans-serif;
			line-height: 1.6;
		}
		h1 {
			color: #1f2937;
			font-size: 24px;
		}
		a {
			display: inline-block;
			padding: 12px 22px;
			border-radius: 6px;
			background-color: #4b5563;
			color: #ffffff;
			text-decoration: none;
			font-weight: bold;
		}
		p {
			margin: 16px 0;
		}
	</style>
</head>
<body>
	<h1 th:text="#{mail.confirm.title}">Confirm your account</h1>
	<p th:text="#{mail.confirm.greeting(${name})}">Hello,</p>
	<p th:text="#{mail.confirm.message}">Please confirm your account using the button below.</p>
	<p><a th:href="${link}" th:text="#{mail.confirm.button}">Confirm account</a></p>
	<p th:text="#{mail.confirm.fallback}">If the button does not work, copy and paste this link into your browser:</p>
	<p th:text="${link}"></p>
	<p th:text="#{mail.confirm.expiry(${expiresHours})}">This link expires soon.</p>
</body>
</html>
