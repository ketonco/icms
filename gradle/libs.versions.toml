[versions]
java = "24"
springBoot = "4.1.1"
springCloud = "2025.1.3"
dependencyManagement = "1.1.7"
liquibase = "2.2.2"
mapstruct = "1.6.3"
lombok = "1.18.38"
lombokMapstructBinding = "0.2.0"
postgresql = "42.7.4"
instancio = "5.4.0"
picocli = "4.7.6"
rest-assured = "6.0.1"
wiremock = "3.13.2"
springBootDependencies = "4.1.1"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
liquibase = { id = "org.liquibase.gradle", version.ref = "liquibase" }
spring-boot-dependencies = { id = "org.springframework.boot", version.ref = "springBootDependencies" }

[libraries]
# Plugins (para buildSrc)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
dependency-management-gradle-plugin = { module = "io.spring.dependency-management:io.spring.dependency-management.gradle.plugin", version.ref = "dependencyManagement" }
liquibase-gradle-plugin = { module = "org.liquibase.gradle:org.liquibase.gradle.gradle.plugin", version.ref = "liquibase" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBootDependencies" }

# Spring Boot Starters Core
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
spring-data-envers = { module = "org.springframework.data:spring-data-envers" }
#spring-security-webflux = { module = "org.springframework.security:spring-security-webflux" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }

# Spring Cloud
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }

# Base de datos y utilidades CLI
liquibase-core = { module = "org.liquibase:liquibase-core" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

# Mapeo y Código Boilerplate
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Pruebas (Test)
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
reactor-test = { module = "io.projectreactor:reactor-test" }
instancio-junit = { module = "org.instancio:instancio-junit", version.ref = "instancio" }
mockito-core = { module = "org.mockito:mockito-core" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
rest-assured-mockmvc = { module = "io.rest-assured:spring-mock-mvc", version.ref = "rest-assured" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-liquibase-test = { module = "org.springframework.boot:spring-boot-starter-liquibase-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-test-autoconfigure = { module = "org.springframework.boot:spring-boot-test-autoconfigure" }

# 